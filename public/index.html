<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>BusStopper</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://code.jquery.com/ui/1.13.2/themes/base/jquery-ui.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="p-4">

<div class="container">
    <h1 class="mb-4">BusStopper</h1>

    <!-- Выбор региона -->
    <div class="mb-3">
        <label for="regionInput" class="form-label">Region</label>
        <input id="regionInput" class="form-control" placeholder="Type region...">
    </div>

    <!-- Выбор остановки -->
    <div class="mb-3">
        <label for="stopInput" class="form-label">Bus Stop</label>
        <input id="stopInput" class="form-control" placeholder="Type bus stop...">
    </div>

    <!-- Кнопка поиска автобусов -->
    <button id="searchBuses" class="btn btn-primary mb-3">Search Buses</button>

    <!-- Кнопка поиска автобусов по ближайшей остановке -->
    <button id="findNearest" class="btn btn-info mb-3">Find Nearest Stop</button>

    <!-- Кнопка очистки выбора -->
    <button id="clearSelection" class="btn btn-secondary mb-3">Clear</button>

    <!-- Список автобусов -->
    <div id="busList" class="mb-3"></div>

    <!-- Время ближайших автобусов -->
    <div id="busTimes"></div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://code.jquery.com/ui/1.13.2/jquery-ui.js"></script>
<script src="script.js"></script>
</body>
</html>
